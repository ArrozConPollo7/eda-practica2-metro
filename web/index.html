<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro de Medellín · Navegador de rutas</title>
<style>
  :root {
    --tinta: #1a1a1a;
    --gris: #5f6368;
    --linea: #e2e6e0;
    --fondo: #f5f6f3;
    --tarjeta: #ffffff;
    --acento: #00843d;
    --verde: #00843d;
    --verde-logo: #5cab42;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: 64px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ------------------------------- cabecera ------------------------------- */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 24px;
    background: #231f20;
    color: #fff;
    border-bottom: 3px solid var(--verde-logo);
  }
  header .logo {
    height: 52px; width: auto; display: block;
  }
  header h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: 0.1px; }
  header h1 span { font-weight: 400; opacity: 0.65; margin-left: 8px; font-size: 14px; }
  header .datos { margin-left: auto; font-size: 12.5px; opacity: 0.72; }

  /* ------------------------------- panel ---------------------------------- */
  aside {
    padding: 16px;
    overflow-y: auto;
    border-right: 1px solid var(--linea);
    background: var(--fondo);
  }
  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--linea);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .tarjeta h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--gris); margin: 0 0 10px; font-weight: 650;
  }
  .campo { position: relative; margin-bottom: 8px; }
  .campo label {
    display: block; font-size: 11.5px; color: var(--gris);
    margin-bottom: 4px; font-weight: 600;
  }
  .campo input {
    width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--linea); border-radius: 8px; background: #fbfcfe;
    color: var(--tinta);
  }
  .campo input:focus { outline: 2px solid #cbe7d6; border-color: var(--verde); }
  .campo input::placeholder { color: #97a1b0; }
  .sugerencias {
    position: absolute; z-index: 20; left: 0; right: 0; top: 100%;
    margin-top: 4px; background: #fff; border: 1px solid var(--linea);
    border-radius: 8px; box-shadow: 0 12px 28px rgba(20,33,61,0.14);
    max-height: 216px; overflow-y: auto; display: none;
  }
  .sugerencias.abierta { display: block; }
  .sugerencias button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 11px; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 13.5px; text-align: left; color: var(--tinta);
  }
  .sugerencias button:hover, .sugerencias button.activa { background: #edf6f0; }
  .punto { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }

  .fila { display: flex; gap: 8px; align-items: center; }
  .intercambiar {
    border: 1px solid var(--linea); background: #fbfcfe; color: var(--gris);
    border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px;
  }
  .intercambiar:hover { background: #edf6f0; color: var(--tinta); }

  .control { margin-bottom: 12px; }
  .control:last-child { margin-bottom: 0; }
  .control .cabecera-control {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12.5px; color: var(--gris); margin-bottom: 5px; font-weight: 600;
  }
  .control output { color: var(--tinta); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acento); }
  select {
    width: 100%; padding: 8px 10px; font: inherit; font-size: 13.5px;
    border: 1px solid var(--linea); border-radius: 8px; background: #fbfcfe; color: var(--tinta);
  }
  .casilla { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta); cursor: pointer; }
  .casilla input { accent-color: var(--acento); width: 15px; height: 15px; }

  /* ------------------------------ resultado ------------------------------- */
  .tiempo { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
  .tiempo strong { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .tiempo span { font-size: 13px; color: var(--gris); }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .etiqueta {
    font-size: 11.5px; font-weight: 650; padding: 3px 8px; border-radius: 20px;
    color: #fff; letter-spacing: 0.02em;
  }
  .resumen { font-size: 12.5px; color: var(--gris); margin-bottom: 10px; }

  ol.paradas { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow-y: auto; }
  ol.paradas li {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 8px;
    align-items: center; padding: 5px 2px; font-size: 13px;
  }
  ol.paradas li .marca { width: 9px; height: 9px; border-radius: 50%; margin: 0 auto; }
  ol.paradas li .min { font-variant-numeric: tabular-nums; color: var(--gris); font-size: 12px; }
  ol.paradas li.transbordo {
    grid-template-columns: 14px 1fr; font-size: 11.5px; color: var(--gris);
    font-style: italic; border-top: 1px dashed var(--linea); border-bottom: 1px dashed var(--linea);
    margin: 2px 0;
  }

  .alternativas { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .alternativa {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    border: 1px solid var(--linea); background: #fbfcfe; border-radius: 9px;
    padding: 7px 10px; font-size: 12.5px; cursor: pointer; color: var(--tinta);
    font-family: inherit; text-align: left;
  }
  .alternativa:hover { background: #edf6f0; }
  .alternativa.activa { border-color: var(--verde); background: #edf6f0; }
  .alternativa b { font-variant-numeric: tabular-nums; }

  /* ------------------------- comparación A*/Dijkstra ---------------------- */
  .columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metrica { font-size: 12px; color: var(--gris); }
  .metrica strong { display: block; font-size: 17px; color: var(--tinta); font-variant-numeric: tabular-nums; }
  .barra { height: 6px; border-radius: 4px; background: #eef1f5; overflow: hidden; margin-top: 6px; }
  .barra i { display: block; height: 100%; border-radius: 4px; background: var(--verde-logo); }
  .barra.a i { background: var(--verde); }

  .aviso { font-size: 13px; color: #b3261e; }
  .vacio { font-size: 13px; color: var(--gris); line-height: 1.45; }

  /* -------------------------------- mapa ---------------------------------- */
  main { position: relative; overflow: hidden; background: #fff; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.arrastrando { cursor: grabbing; }
  .leyenda {
    position: absolute; left: 18px; bottom: 16px;
    background: rgba(255,255,255,0.94); border: 1px solid var(--linea);
    border-radius: 10px; padding: 8px 10px; display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--gris); box-shadow: 0 6px 18px rgba(20,33,61,0.07);
    max-width: calc(100% - 60px);
  }
  .leyenda span { display: flex; align-items: center; gap: 5px; }
  .leyenda i { width: 16px; height: 4px; border-radius: 2px; display: block; }
  .ayuda {
    position: absolute; right: 18px; top: 16px;
    background: rgba(255,255,255,0.94); border: 1px solid var(--linea);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--gris);
    box-shadow: 0 6px 18px rgba(20,33,61,0.07);
  }
  .ayuda b { color: var(--tinta); }
  .zoom {
    position: absolute; right: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 6px;
  }
  .zoom button {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--linea);
    background: #fff; color: var(--tinta); font-size: 16px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(20,33,61,0.08);
  }
  .zoom button:hover { background: #edf6f0; }
</style>
</head>

<script>
"use strict";

const estado = {
  estaciones: [], lineas: [], aristas: [],
  porId: new Map(),
  colorLinea: new Map(),
  origen: null, destino: null,
  cerrada: "", k: 3, transbordo: 3,
  rutas: [], activa: 0,
  articulacion: []
};

const svg = document.getElementById("mapa");
const camara = document.getElementById("camara");
const capaLineas = document.getElementById("capaLineas");
const capaEstaciones = document.getElementById("capaEstaciones");
const capaRuta = document.getElementById("capaRuta");
const capaEtiquetas = document.getElementById("capaEtiquetas");

let proyeccion = { x: () => 0, y: () => 0, escala: 1 };
let vista = { x: 0, y: 0, k: 1 };

const fmt = (v, d = 1) => v.toFixed(d).replace(".", ",");

/* ------------------------------- carga ---------------------------------- */
async function cargarRed() {
  const datos = await (await fetch("/api/grafo")).json();
  estado.estaciones = datos.estaciones;
  estado.lineas = datos.lineas;
  estado.aristas = datos.aristas;
  for (const e of datos.estaciones) estado.porId.set(e.id, e);
  for (const l of datos.lineas) estado.colorLinea.set(l.codigo, l.color);

  document.getElementById("datosRed").textContent =
    `${datos.estaciones.length} estaciones · ${datos.lineas.length} líneas · ` +
    `${datos.aristas.length} tramos`;

  dibujarMapa();
  llenarSelectCerrada();
  dibujarLeyenda();
}

function dibujarLeyenda() {
  const caja = document.getElementById("leyenda");
  caja.innerHTML = estado.lineas.map(l =>
    `<span><i style="background:${l.color}"></i>${l.codigo}</span>`).join("");
}

function llenarSelectCerrada() {
  const sel = document.getElementById("cerrada");
  const orden = [...estado.estaciones].sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  sel.innerHTML = '<option value="">Ninguna</option>' +
    orden.map(e => `<option value="${e.id}">${e.nombre}</option>`).join("");
}

/* ---------------------------- proyección -------------------------------- */
function calcularProyeccion(ancho, alto) {
  const lats = estado.estaciones.map(e => e.lat);
  const lons = estado.estaciones.map(e => e.lon);
  const latMin = Math.min(...lats), latMax = Math.max(...lats);
  const lonMin = Math.min(...lons), lonMax = Math.max(...lons);
  const cos = Math.cos(((latMin + latMax) / 2) * Math.PI / 180);
  const margen = 46;
  const escala = Math.min(
    (ancho - 2 * margen) / ((lonMax - lonMin) * cos),
    (alto - 2 * margen) / (latMax - latMin)
  );
  const usadoX = (lonMax - lonMin) * cos * escala;
  const usadoY = (latMax - latMin) * escala;
  const offX = (ancho - usadoX) / 2;
  const offY = (alto - usadoY) / 2;
  return {
    escala,
    x: lon => offX + (lon - lonMin) * cos * escala,
    y: lat => offY + (latMax - lat) * escala
  };
}

/* ------------------------------- mapa ----------------------------------- */
function dibujarMapa() {
  const ancho = svg.clientWidth || 900;
  const alto = svg.clientHeight || 700;
  svg.setAttribute("viewBox", `0 0 ${ancho} ${alto}`);
  proyeccion = calcularProyeccion(ancho, alto);

  capaLineas.innerHTML = estado.aristas.map(a => {
    const o = estado.porId.get(a.o), d = estado.porId.get(a.d);
    return `<line x1="${proyeccion.x(o.lon).toFixed(1)}" y1="${proyeccion.y(o.lat).toFixed(1)}"
      x2="${proyeccion.x(d.lon).toFixed(1)}" y2="${proyeccion.y(d.lat).toFixed(1)}"
      stroke="${estado.colorLinea.get(a.l)}" stroke-width="4.5" stroke-linecap="round"
      opacity="0.42"/>`;
  }).join("");

  capaEstaciones.innerHTML = estado.estaciones.map(e => {
    const grande = e.lineas.length > 1;
    const r = grande ? 6 : 4;
    return `<circle data-id="${e.id}" cx="${proyeccion.x(e.lon).toFixed(1)}"
      cy="${proyeccion.y(e.lat).toFixed(1)}" r="${r}" fill="#fff"
      stroke="${estado.colorLinea.get(e.lineas[0])}" stroke-width="${grande ? 2.4 : 1.7}"
      style="cursor:pointer"><title>${e.nombre}</title></circle>`;
  }).join("");

  capaEstaciones.querySelectorAll("circle").forEach(c => {
    c.addEventListener("click", ev => {
      ev.stopPropagation();
      elegirEnMapa(c.dataset.id);
    });
  });

  dibujarEtiquetas(null);
  aplicarVista();
}

// Coloca los nombres sin encimarse: primero las paradas de la ruta (en
// negrita) y luego los intercambiadores que no están en ella (en gris).
// Cada etiqueta prueba los dos lados de la estación y varios desplazamientos
// verticales hasta encontrar un hueco.
function dibujarEtiquetas(ruta) {
  const ocupados = [];
  const textos = [];
  const anchoMapa = svg.clientWidth || 900;
  const enRuta = new Set(ruta ? ruta.paradas.map(p => p.id) : []);
  const items = [];

  // Los rótulos de la ruta no deben quedar encima de la línea: se reservan
  // cajas delgadas a lo largo de cada tramo antes de ubicar los nombres.
  if (ruta) {
    for (let i = 0; i + 1 < ruta.paradas.length; i++) {
      const a = estado.porId.get(ruta.paradas[i].id);
      const b = estado.porId.get(ruta.paradas[i + 1].id);
      const x1 = proyeccion.x(a.lon), y1 = proyeccion.y(a.lat);
      const x2 = proyeccion.x(b.lon), y2 = proyeccion.y(b.lat);
      const pasos = 14;
      for (let s = 0; s < pasos; s++) {
        const t0 = s / pasos, t1 = (s + 1) / pasos;
        ocupados.push({
          x0: Math.min(x1 + (x2 - x1) * t0, x1 + (x2 - x1) * t1) - 4,
          x1: Math.max(x1 + (x2 - x1) * t0, x1 + (x2 - x1) * t1) + 4,
          y0: Math.min(y1 + (y2 - y1) * t0, y1 + (y2 - y1) * t1) - 5,
          y1: Math.max(y1 + (y2 - y1) * t0, y1 + (y2 - y1) * t1) + 5
        });
      }
    }
  }

  if (ruta) {
    for (const p of ruta.paradas) items.push({ e: estado.porId.get(p.id), fuerte: true });
  } else {
    for (const e of estado.estaciones) {
      if (e.lineas.length > 1) items.push({ e, fuerte: false });
    }
  }

  for (const { e, fuerte } of items) {
    const x = proyeccion.x(e.lon), y = proyeccion.y(e.lat);
    const alto = fuerte ? 13 : 12;
    const ancho = e.nombre.length * (fuerte ? 6.9 : 6.3) + 6;
    let colocado = null;
    for (const lado of ["der", "izq"]) {
      const aLaIzquierda = lado === "izq";
      const x0 = aLaIzquierda ? x - 10 - ancho : x + 10;
      const x1 = aLaIzquierda ? x - 10 : x + 10 + ancho;
      if (!aLaIzquierda && x > anchoMapa - 150) continue;
      if (aLaIzquierda && x < 150) continue;
      for (const intento of [0, -13, 13, -26, 26, -39, 39, -52, 52]) {
        const y0 = y + intento - alto + 3, y1 = y + intento + 4;
        if (ocupados.some(o => x0 < o.x1 && o.x0 < x1 && y0 < o.y1 && o.y0 < y1)) continue;
        ocupados.push({ x0, x1, y0, y1 });
        colocado = { x: aLaIzquierda ? x - 10 : x + 10, y: y + 4 + intento, izq: aLaIzquierda };
        break;
      }
      if (colocado) break;
    }
    if (!colocado) continue;
    textos.push(`<text x="${colocado.x.toFixed(1)}" y="${colocado.y.toFixed(1)}"
      font-size="${fuerte ? 12.5 : 11.5}" font-weight="${fuerte ? 600 : 400}"
      fill="${fuerte ? "#1a1a1a" : "#5f6368"}" text-anchor="${colocado.izq ? "end" : "start"}"
      ${fuerte ? 'stroke="#ffffff" stroke-width="3.2" paint-order="stroke"' : ""}
      style="pointer-events:none">${e.nombre}</text>`);
  }
  capaEtiquetas.innerHTML = textos.join("");
}

/* ---------------------------- zoom y arrastre --------------------------- */
function aplicarVista() {
  camara.setAttribute("transform", `translate(${vista.x} ${vista.y}) scale(${vista.k})`);
}

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  const nuevo = Math.min(6, Math.max(0.7, vista.k * factor));
  const real = nuevo / vista.k;
  vista.x = px - (px - vista.x) * real;
  vista.y = py - (py - vista.y) * real;
  vista.k = nuevo;
  aplicarVista();
}, { passive: false });

let arrastre = null;
svg.addEventListener("pointerdown", ev => {
  arrastre = { x: ev.clientX - vista.x, y: ev.clientY - vista.y };
  svg.classList.add("arrastrando");
});
svg.addEventListener("pointermove", ev => {
  if (!arrastre) return;
  vista.x = ev.clientX - arrastre.x;
  vista.y = ev.clientY - arrastre.y;
  aplicarVista();
});
svg.addEventListener("pointerup", () => { arrastre = null; svg.classList.remove("arrastrando"); });
svg.addEventListener("pointerleave", () => { arrastre = null; svg.classList.remove("arrastrando"); });

document.getElementById("mas").onclick = () => { vista.k = Math.min(6, vista.k * 1.25); aplicarVista(); };
document.getElementById("menos").onclick = () => { vista.k = Math.max(0.7, vista.k / 1.25); aplicarVista(); };
document.getElementById("intercambiar").onclick = () => {
  const o = estado.origen, d = estado.destino;
  estado.origen = d; estado.destino = o;
  document.getElementById("origen").value = estado.origen ? estado.porId.get(estado.origen).nombre : "";
  document.getElementById("destino").value = estado.destino ? estado.porId.get(estado.destino).nombre : "";
  consultar();
};

/* --------------------------- autocompletado ----------------------------- */
function conectarAutocompletado(input, caja, alElegir) {
  let temporizador = null;
  let activo = -1;

  const cerrar = () => { caja.classList.remove("abierta"); caja.innerHTML = ""; activo = -1; };

  input.addEventListener("input", () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(async () => {
      const q = input.value.trim();
      if (q.length === 0) { cerrar(); return; }
      const datos = await (await fetch(`/api/estaciones?q=${encodeURIComponent(q)}`)).json();
      if (datos.estaciones.length === 0) { cerrar(); return; }
      caja.innerHTML = datos.estaciones.map((e, i) =>
        `<button data-id="${e.id}" class="${i === 0 ? "activa" : ""}">
           <span class="punto" style="background:${estado.colorLinea.get(e.lineas[0])}"></span>
           ${e.nombre}
         </button>`).join("");
      caja.classList.add("abierta");
      activo = 0;
      caja.querySelectorAll("button").forEach(b => {
        b.onclick = () => { alElegir(b.dataset.id); cerrar(); };
      });
    }, 110);
  });

  input.addEventListener("keydown", ev => {
    if (!caja.classList.contains("abierta")) return;
    const botones = [...caja.querySelectorAll("button")];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      botones[activo]?.classList.remove("activa");
      activo = (activo + (ev.key === "ArrowDown" ? 1 : -1) + botones.length) % botones.length;
      botones[activo].classList.add("activa");
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      if (botones[activo]) { alElegir(botones[activo].dataset.id); cerrar(); }
    } else if (ev.key === "Escape") {
      cerrar();
    }
  });

  input.addEventListener("blur", () => setTimeout(cerrar, 140));
}

function fijarOrigen(id) {
  estado.origen = id;
  document.getElementById("origen").value = id ? estado.porId.get(id).nombre : "";
  consultar();
}
function fijarDestino(id) {
  estado.destino = id;
  document.getElementById("destino").value = id ? estado.porId.get(id).nombre : "";
  consultar();
}

conectarAutocompletado(document.getElementById("origen"), document.getElementById("sugOrigen"), fijarOrigen);
conectarAutocompletado(document.getElementById("destino"), document.getElementById("sugDestino"), fijarDestino);

function elegirEnMapa(id) {
  if (!estado.origen || (estado.origen && estado.destino)) {
    estado.destino = null;
    document.getElementById("destino").value = "";
    fijarOrigen(id);
  } else if (id !== estado.origen) {
    fijarDestino(id);
  }
}

/* ------------------------------- consulta -------------------------------- */
let peticion = 0;
async function consultar() {
  if (!estado.origen || !estado.destino) return;
  const mio = ++peticion;
  const url = `/api/ruta?o=${encodeURIComponent(estado.origen)}&d=${encodeURIComponent(estado.destino)}` +
    `&k=${estado.k}&transbordo=${estado.transbordo}` +
    (estado.cerrada ? `&cerrada=${encodeURIComponent(estado.cerrada)}` : "");
  const datos = await (await fetch(url)).json();
  if (mio !== peticion) return;

  estado.rutas = datos.rutas || [];
  estado.activa = 0;
  pintarResultado(datos);
  pintarComparacion(datos);
  pintarRutaEnMapa();
}

function chipLinea(codigo) {
  return `<span class="etiqueta" style="background:${estado.colorLinea.get(codigo)};` +
    `${codigo === "J" ? "color:#1a1a1a" : ""}">${codigo}</span>`;
}

function pintarResultado(datos) {
  const caja = document.getElementById("resultado");

  if (!datos.encontrada) {
    caja.className = "aviso";
    caja.innerHTML = estado.cerrada
      ? "No hay ruta con esa estación cerrada. Prueba sin cerrarla o cambia el destino."
      : "No hay ruta entre esas dos estaciones.";
    return;
  }
  if (estado.rutas.length === 0) {
    caja.className = "vacio";
    caja.textContent = "Sin resultados.";
    return;
  }

  const ruta = estado.rutas[estado.activa];
  const lineas = [...new Set(ruta.paradas.map(p => p.linea))];
  const transbordos = lineas.length - 1;

  let html = `<div class="tiempo"><strong>${fmt(ruta.minutos)}</strong><span>minutos</span></div>`;
  html += `<div class="etiquetas">${lineas.map(chipLinea).join("")}</div>`;
  html += `<div class="resumen">${ruta.paradas.length} estaciones · ` +
          `${transbordos} transbordo${transbordos === 1 ? "" : "s"}` +
          (estado.cerrada ? ` · ${estado.porId.get(estado.cerrada).nombre} cerrada` : "") + `</div>`;

  if (estado.rutas.length > 1) {
    html += `<div class="alternativas">` + estado.rutas.map((r, i) => {
      const ls = [...new Set(r.paradas.map(p => p.linea))].map(chipLinea).join(" ");
      return `<button class="alternativa ${i === estado.activa ? "activa" : ""}" data-i="${i}">
        <span>Ruta ${i + 1} ${ls}</span><b>${fmt(r.minutos)} min</b></button>`;
    }).join("") + `</div>`;
  }

  html += `<ol class="paradas">`;
  ruta.paradas.forEach((p, i) => {
    if (i > 0 && ruta.paradas[i - 1].linea !== p.linea) {
      html += `<li class="transbordo"><span></span>transbordo a línea ${p.linea} en ${ruta.paradas[i - 1].nombre}</li>`;
    }
    html += `<li><span class="marca" style="background:${estado.colorLinea.get(p.linea)}"></span>` +
            `<span>${p.nombre}</span><span class="min">${fmt(p.acum)}</span></li>`;
  });
  html += `</ol>`;

  caja.className = "";
  caja.innerHTML = html;
  caja.querySelectorAll(".alternativa").forEach(b => {
    b.onclick = () => { estado.activa = Number(b.dataset.i); pintarResultado(datos); pintarRutaEnMapa(); };
  });
}

function pintarComparacion(datos) {
  const tarjeta = document.getElementById("tarjetaComparacion");
  if (!datos.encontrada) { tarjeta.style.display = "none"; return; }
  tarjeta.style.display = "";
  const d = datos.dijkstra, a = datos.astar;
  const maximo = Math.max(d.nodos, a.nodos, 1);
  document.getElementById("nodosD").textContent = d.nodos;
  document.getElementById("nodosA").textContent = a.nodos;
  document.getElementById("usD").textContent = `${fmt(d.us)} µs`;
  document.getElementById("usA").textContent = `${fmt(a.us)} µs`;
  document.getElementById("barraD").style.width = `${(d.nodos / maximo) * 100}%`;
  document.getElementById("barraA").style.width = `${(a.nodos / maximo) * 100}%`;
}

/* ---------------------------- ruta en el mapa --------------------------- */
function pintarRutaEnMapa() {
  const ruta = estado.rutas[estado.activa];
  if (!ruta) { capaRuta.innerHTML = ""; return; }

  const puntos = ruta.paradas.map(p => {
    const e = estado.porId.get(p.id);
    return [proyeccion.x(e.lon), proyeccion.y(e.lat)];
  });
  const cadena = puntos.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");

  let svgRuta = `<polyline points="${cadena}" fill="none" stroke="#ffffff" stroke-width="11"
    stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>`;
  svgRuta += `<polyline points="${cadena}" fill="none" stroke="#00843d" stroke-width="5"
    stroke-linejoin="round" stroke-linecap="round"/>`;

  svgRuta += ruta.paradas.map(p => {
    const e = estado.porId.get(p.id);
    return `<circle cx="${proyeccion.x(e.lon).toFixed(1)}" cy="${proyeccion.y(e.lat).toFixed(1)}"
      r="6.5" fill="#00843d" stroke="#ffffff" stroke-width="2.2"/>`;
  }).join("");

  capaRuta.innerHTML = svgRuta;
  dibujarEtiquetas(ruta);

  if (estado.articulacion.length) {
    capaRuta.innerHTML += estado.articulacion.map(id => {
      const e = estado.porId.get(id);
      return `<circle cx="${proyeccion.x(e.lon).toFixed(1)}" cy="${proyeccion.y(e.lat).toFixed(1)}"
        r="11" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.75">
        <title>${e.nombre}: punto de articulación</title></circle>`;
    }).join("");
  }
}

/* ------------------------------- controles ------------------------------- */
document.getElementById("transbordo").addEventListener("input", ev => {
  estado.transbordo = Number(ev.target.value);
  document.getElementById("valorTransbordo").textContent = `${fmt(estado.transbordo)} min`;
  consultar();
});
document.getElementById("alternativas").addEventListener("change", ev => {
  estado.k = Number(ev.target.value);
  consultar();
});
document.getElementById("cerrada").addEventListener("change", ev => {
  estado.cerrada = ev.target.value;
  consultar();
});
document.getElementById("articulacion").addEventListener("change", async ev => {
  if (ev.target.checked && estado.articulacion.length === 0) {
    const datos = await (await fetch("/api/articulacion")).json();
    estado.articulacion = datos.puntos.map(p => p.id);
  }
  if (!ev.target.checked) estado.articulacion = [];
  if (estado.rutas.length) pintarRutaEnMapa();
  else capaRuta.innerHTML = "";
});

window.addEventListener("resize", () => {
  const anchoViejo = svg.viewBox.baseVal.width || 1;
  dibujarMapa();
  if (estado.rutas.length) pintarRutaEnMapa();
  void anchoViejo;
});

cargarRed();
</script>
